name: Deploy Keycloak to Kubernetes

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'k8s/**'
      - 'themes/**'

env:
  IMAGE: ghcr.io/datweb-sistemas/keycloak:latest

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Create GHCR image pull secret in cluster
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GHCR_TOKEN }} \
            --docker-email=devops@datweb.com.br \
            --namespace=keycloak \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: |
          # Aplicar namespace primeiro para garantir que ele exista
          kubectl apply -f k8s/namespace.yaml

          # Aguardar o namespace estar pronto
          kubectl wait --for=jsonpath='{.status.phase}'=Active namespace/keycloak --timeout=30s

          # Aplicar os demais manifests
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secret.yaml
          kubectl apply -f k8s/pvc.yaml
          kubectl apply -f k8s/certificate.yaml
          kubectl apply -f k8s/istio-gateway.yaml
          kubectl apply -f k8s/istio-authpolicy.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/deployment.yaml

      - name: Update deployment image
        run: |
          kubectl set image deployment/keycloak \
            keycloak=${{ env.IMAGE }} \
            -n keycloak

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/keycloak -n keycloak --timeout=300s
