apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: keycloak-gateway
  namespace: keycloak
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: SIMPLE
        # credentialName deve bater com o secretName do Certificate (certificate.yaml)
        credentialName: keycloak-tls-secret
      hosts:
        - auth.datwebsistemas.com.br
    - port:
        number: 80
        name: http
        protocol: HTTP
      # httpsRedirect instrui o Istio a emitir redirect 301 para HTTPS no nível do Gateway,
      # dispensando a necessidade de uma regra separada no VirtualService.
      tls:
        httpsRedirect: true
      hosts:
        - auth.datwebsistemas.com.br
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: keycloak-vs
  namespace: keycloak
spec:
  hosts:
    - auth.datwebsistemas.com.br
  gateways:
    - keycloak-gateway
  http:
    # Rota única para HTTPS: encaminha para o Service keycloak na porta 80
    # (Service.spec.ports[].port=80 -> targetPort=8080 no Pod).
    - route:
        - destination:
            host: keycloak
            port:
              number: 80
