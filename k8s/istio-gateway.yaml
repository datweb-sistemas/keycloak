apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: keycloak-gateway
  namespace: keycloak
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: SIMPLE
        # credentialName deve bater com o secretName do Certificate (certificate.yaml).
        # IMPORTANTE: o Istio IngressGateway busca este secret no namespace istio-system,
        # não no namespace keycloak. O secret deve existir em ambos os namespaces.
        # Para copiar o secret para istio-system após emissão pelo cert-manager, execute:
        #   kubectl get secret keycloak-tls-secret -n keycloak -o yaml | \
        #     python3 -c "
        #   import sys, yaml
        #   d = yaml.safe_load(sys.stdin)
        #   d['metadata'] = {'name': 'keycloak-tls-secret', 'namespace': 'istio-system'}
        #   print(yaml.dump(d))
        #   " | kubectl apply -f -
        credentialName: keycloak-tls-secret
      hosts:
        - auth.datwebsistemas.com.br
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - auth.datwebsistemas.com.br
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: keycloak-vs
  namespace: keycloak
spec:
  hosts:
    - auth.datwebsistemas.com.br
  gateways:
    - keycloak-gateway
  http:
    # Regra 1: todo o tráfego HTTP recebe redirect 301 para HTTPS
    # O cert-manager (HTTP-01 via ingress.class=istio) cria Ingress temporário
    # automaticamente para o desafio ACME durante renovação do certificado.
    - match:
        - port: 80
      redirect:
        scheme: https
        redirectCode: 301
    # Regra 2: tráfego HTTPS encaminhado para o Service keycloak
    # (Service.spec.ports[].port=80 -> targetPort=8080 no Pod).
    - route:
        - destination:
            host: keycloak
            port:
              number: 80
