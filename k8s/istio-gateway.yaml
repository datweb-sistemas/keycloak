apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: keycloak-gateway
  namespace: keycloak
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: SIMPLE
        # credentialName deve bater com o secretName do Certificate (certificate.yaml)
        credentialName: keycloak-tls-secret
      hosts:
        - auth.datwebsistemas.com.br
    - port:
        number: 80
        name: http
        protocol: HTTP
      # Sem httpsRedirect aqui para permitir que o VirtualService decida:
      # requisições ao path /.well-known/acme-challenge/ vão para o solver do cert-manager,
      # todas as demais recebem redirect 301 para HTTPS.
      hosts:
        - auth.datwebsistemas.com.br
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: keycloak-vs
  namespace: keycloak
spec:
  hosts:
    - auth.datwebsistemas.com.br
  gateways:
    - keycloak-gateway
  http:
    # Regra 1: ACME HTTP-01 challenge — roteia para o solver do cert-manager sem redirect
    - match:
        - uri:
            prefix: "/.well-known/acme-challenge/"
      route:
        - destination:
            host: cm-acme-http-solver-tzg9n
            port:
              number: 8089
    # Regra 2: todo o tráfego HTTP restante recebe redirect 301 para HTTPS
    - match:
        - port: 80
      redirect:
        scheme: https
        redirectCode: 301
    # Regra 3: tráfego HTTPS encaminhado para o Service keycloak
    # (Service.spec.ports[].port=80 -> targetPort=8080 no Pod).
    - route:
        - destination:
            host: keycloak
            port:
              number: 80
