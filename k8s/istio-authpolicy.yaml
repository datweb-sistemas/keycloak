# ATENÇÃO: Antes do deploy em produção, adicione os CIDRs corporativos permitidos
# na AuthorizationPolicy abaixo (keycloak-admin-deny-non-corporate).
# Substitua os placeholders "CORPORATE_CIDR_1" e "CORPORATE_CIDR_2" pelos blocos
# de IP reais da sua rede corporativa (ex: "10.0.0.0/8", "192.168.1.0/24").
#
# Abordagem utilizada (correta para o modelo de precedência do Istio):
#   - Uma única policy DENY com notIpBlocks bloqueia qualquer IP que NÃO esteja
#     na lista de CIDRs corporativos ao acessar os paths de administração.
#   - Isso evita o bug da abordagem ALLOW+DENY separadas, onde o DENY (sem filtro
#     de source) teria precedência sobre o ALLOW e bloquearia TODOS os IPs,
#     inclusive os corporativos listados.
#
# Para liberar um novo CIDR: adicione-o em notIpBlocks (mantém a negação correta).

---
# Policy: DENY — bloqueia acesso ao admin console para IPs fora da lista corporativa.
# notIpBlocks: "negar se o IP de origem NÃO estiver nesta lista".
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: keycloak-admin-deny-non-corporate
  namespace: keycloak
spec:
  selector:
    matchLabels:
      app: keycloak
  action: DENY
  rules:
    - from:
        - source:
            # notIpBlocks: IPs que NÃO estão aqui serão bloqueados nos paths de admin.
            # Adicione aqui os CIDRs corporativos autorizados a acessar o admin console.
            # Exemplos: "10.0.0.0/8", "192.168.1.0/24", "203.0.113.0/28"
            notIpBlocks:
              - "10.14.56.0/24"    # Rede interna do cluster Kubernetes (nodes)
              - "10.244.0.0/16"    # Pod CIDR do cluster Kubernetes (IngressGateway e outros pods)
              - "10.128.48.0/22"   # Rede corporativa interna (workstations / VPN)
      to:
        - operation:
            ports:
              - "8080"
            paths:
              - "/auth/admin/*"
              - "/admin/*"
