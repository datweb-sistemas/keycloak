# EnvoyFilter — Keycloak Admin IP Allowlist
#
# Causa raiz: AuthorizationPolicy com remoteIpBlocks não funciona porque o MeshConfig
# não tem numTrustedProxies configurado (padrão = 0), então o Envoy não lê o header
# X-Forwarded-For para determinar o IP real do cliente.
#
# Solução: EnvoyFilter RBAC direto no IngressGateway usando remote_ip (IP da conexão TCP),
# que é o IP real do cliente quando o LoadBalancer faz DNAT sem SNAT (externalTrafficPolicy: Local)
# ou quando o cliente está direto. Isso é mais confiável que depender de XFF headers.
#
# Este filtro NEGA acesso a /admin/ para qualquer IP que NÃO esteja na lista permitida.
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: keycloak-admin-ip-filter
  namespace: istio-system
spec:
  workloadSelector:
    labels:
      app: istio-ingressgateway
  configPatches:
  - applyTo: HTTP_FILTER
    match:
      context: GATEWAY
      listener:
        filterChain:
          filter:
            name: "envoy.filters.network.http_connection_manager"
    patch:
      operation: INSERT_BEFORE
      value:
        name: envoy.filters.http.rbac
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
          rules:
            action: DENY
            policies:
              "deny-admin-non-corporate":
                permissions:
                - and_rules:
                    rules:
                    - header:
                        name: ":path"
                        string_match:
                          prefix: "/admin/"
                    - header:
                        name: ":authority"
                        string_match:
                          exact: "auth.datwebsistemas.com.br"
                principals:
                - not_id:
                    or_ids:
                      ids:
                      # Redes internas
                      - remote_ip: {address_prefix: "10.14.56.0", prefix_len: 24}
                      - remote_ip: {address_prefix: "10.244.0.0", prefix_len: 16}
                      - remote_ip: {address_prefix: "10.128.0.0", prefix_len: 16}
                      - remote_ip: {address_prefix: "10.128.48.0", prefix_len: 22}
                      - remote_ip: {address_prefix: "172.31.100.0", prefix_len: 24}
                      - remote_ip: {address_prefix: "10.192.0.0", prefix_len: 16}
                      - remote_ip: {address_prefix: "172.18.10.0", prefix_len: 24}
                      # IPs externos autorizados — address-set MGMT-ALLOWED do firewall Juniper SRX CA
                      - remote_ip: {address_prefix: "191.33.183.251", prefix_len: 32}  # MGMT-CLIENT2 / DATWEB-VIVO
                      - remote_ip: {address_prefix: "45.189.41.96", prefix_len: 32}    # MGMT-CLIENT3 / DATWEB-ULTRA
                      - remote_ip: {address_prefix: "187.123.25.199", prefix_len: 32}  # MGMT-CLIENT4 / DATWEB-CLARO
                      - remote_ip: {address_prefix: "70.38.60.69", prefix_len: 32}     # MGMT-CLIENT5 - Leaseweb MTL
                      - remote_ip: {address_prefix: "138.99.19.108", prefix_len: 32}   # MGMT-CLIENT6
                      - remote_ip: {address_prefix: "181.191.209.180", prefix_len: 32} # MGMT-CLIENT7
                      - remote_ip: {address_prefix: "45.174.195.132", prefix_len: 32}  # MGMT-CLIENT8
                      - remote_ip: {address_prefix: "72.55.168.13", prefix_len: 32}    # MGMT-CLIENT9/10
                      - remote_ip: {address_prefix: "181.191.209.181", prefix_len: 32} # MGMT-CLIENT11
                      - remote_ip: {address_prefix: "181.191.209.182", prefix_len: 32} # MGMT-CLIENT12
                      - remote_ip: {address_prefix: "181.191.209.179", prefix_len: 32} # MGMT-CLIENT13
                      - remote_ip: {address_prefix: "201.42.19.52", prefix_len: 32}    # DATWEB SP-VIVO
                      - remote_ip: {address_prefix: "186.192.131.216", prefix_len: 32} # DATWEB SP-DURAND
