# ATENÇÃO: Os valores abaixo são placeholders em base64 e DEVEM ser substituídos
# por valores reais antes do deploy em produção.
# Para gerar um novo valor em base64: echo -n 'seu-valor-aqui' | base64
# NUNCA commite secrets reais neste arquivo. Use um gerenciador de secrets
# (ex: Vault, Sealed Secrets, External Secrets Operator) em ambientes reais.
#
# Pré-deploy checklist:
#   1. Substituir KEYCLOAK_ADMIN pelo nome do usuário administrador desejado
#   2. Substituir KEYCLOAK_ADMIN_PASSWORD por uma senha forte (mín. 20 chars)
#   3. Substituir KC_DB_USERNAME pelo usuário do banco de dados
#   4. Substituir KC_DB_PASSWORD por uma senha forte para o banco
#   5. Garantir que KC_DB_USERNAME e KC_DB_PASSWORD sejam IDÊNTICOS
#      aos valores em postgres.yaml (POSTGRES_USER e POSTGRES_PASSWORD)
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secrets
  namespace: keycloak
type: Opaque
data:
  # echo -n 'CHANGE_ME' | base64
  KEYCLOAK_ADMIN: Q0hBTkdFX01F
  KEYCLOAK_ADMIN_PASSWORD: Q0hBTkdFX01F
  KC_DB_USERNAME: Q0hBTkdFX01F
  KC_DB_PASSWORD: Q0hBTkdFX01F
