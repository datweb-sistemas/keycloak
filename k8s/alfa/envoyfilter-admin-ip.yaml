# EnvoyFilter — Keycloak Admin IP Allowlist (ambiente alfa)
#
# ============================================================
# CAUSA RAIZ DO BLOQUEIO FALHO (DO-158/159/160)
# ============================================================
#
# Problema identificado: O bloqueio de IP para /admin/ falhou porque:
#
# 1. MetalLB opera em modo L2 com externalTrafficPolicy: Cluster (padrão).
#    Fluxo de pacotes: Cliente externo → MetalLB speaker node (ARP) →
#    kube-proxy (faz SNAT para IP do nó) → pod IngressGateway.
#    Resultado: Envoy via remote_ip vê o IP do nó (10.14.56.100-105),
#    que está na lista de IPs permitidos (rede 10.14.56.0/24) → tudo liberado.
#
# 2. O MeshConfig não tinha numTrustedProxies configurado corretamente.
#    O campo deve estar em defaultConfig.gatewayTopology.numTrustedProxies,
#    não no nível raiz do MeshConfig. Sem isso, xff_num_trusted_hops=0 no HCM
#    e AuthorizationPolicy com remoteIpBlocks não lê o XFF header.
#
# ============================================================
# SOLUÇÃO DEFINITIVA APLICADA
# ============================================================
#
# PARTE 1 (infraestrutura): Alterar externalTrafficPolicy do Service istio-ingressgateway
#   De: externalTrafficPolicy: Cluster  (SNAT pelo kube-proxy, IP original perdido)
#   Para: externalTrafficPolicy: Local  (sem SNAT, IP real do cliente preservado)
#
#   Comando aplicado:
#     kubectl patch svc istio-ingressgateway -n istio-system \
#       --type='merge' -p '{"spec":{"externalTrafficPolicy":"Local"}}'
#
#   IMPORTANTE: Com MetalLB L2 + Local, apenas o nó com o pod IngressGateway ativo
#   responde ao ARP. Com 1 réplica (configuração atual), isso é transparente.
#   Se o número de réplicas aumentar, garantir anti-affinity ou DaemonSet.
#
# PARTE 2 (MeshConfig): Adicionar gatewayTopology.numTrustedProxies: 1
#   Isso configura xff_num_trusted_hops=1 no HCM do IngressGateway.
#   Permite que AuthorizationPolicy com remoteIpBlocks (keycloak-admin-ip-allowlist)
#   também funcione corretamente lendo o XFF header.
#   Ver: k8s/alfa/meshconfig-patch.yaml para referência do MeshConfig esperado.
#
# PARTE 3 (este arquivo): EnvoyFilter RBAC no IngressGateway
#   Usa remote_ip (IP da conexão TCP direta) que com externalTrafficPolicy: Local
#   = IP real do cliente externo. Confirmado via logs RBAC debug:
#   "sourceIP: X.X.X.X, directRemoteIP: X.X.X.X, remoteIP: X.X.X.X"
#
# ============================================================
# VALIDAÇÃO
# ============================================================
#
# Teste de bloqueio (IP não autorizado 127.0.0.1 → /admin/):
#   HTTP_403 ✓  (enforced denied, matched policy deny-admin-non-corporate)
#
# Teste de permissão (path / → não /admin/):
#   HTTP_301 ✓  (redirect para HTTPS - tráfego normal não bloqueado)
#
# Teste com XFF unauthorized (8.8.8.8 → /admin/):
#   HTTP_403 ✓  (bloqueado corretamente)
#
# ============================================================
# Este filtro NEGA acesso a /admin/ para qualquer IP que NÃO esteja na lista permitida.
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: keycloak-admin-ip-filter
  namespace: istio-system
spec:
  workloadSelector:
    labels:
      app: istio-ingressgateway
  configPatches:
  - applyTo: HTTP_FILTER
    match:
      context: GATEWAY
      listener:
        filterChain:
          filter:
            name: "envoy.filters.network.http_connection_manager"
    patch:
      operation: INSERT_BEFORE
      value:
        name: envoy.filters.http.rbac
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
          rules:
            action: DENY
            policies:
              "deny-admin-non-corporate":
                permissions:
                - and_rules:
                    rules:
                    - header:
                        name: ":path"
                        string_match:
                          prefix: "/admin/"
                    - header:
                        name: ":authority"
                        string_match:
                          exact: "auth.alfa.promobank.online"
                principals:
                - not_id:
                    or_ids:
                      ids:
                      # Redes internas
                      - remote_ip: {address_prefix: "10.14.56.0", prefix_len: 24}
                      - remote_ip: {address_prefix: "10.244.0.0", prefix_len: 16}
                      - remote_ip: {address_prefix: "10.128.0.0", prefix_len: 16}
                      - remote_ip: {address_prefix: "10.128.48.0", prefix_len: 22}
                      - remote_ip: {address_prefix: "172.31.100.0", prefix_len: 24}
                      - remote_ip: {address_prefix: "10.192.0.0", prefix_len: 16}
                      - remote_ip: {address_prefix: "172.18.10.0", prefix_len: 24}
                      # IPs externos autorizados — address-set MGMT-ALLOWED do firewall Juniper SRX CA
                      - remote_ip: {address_prefix: "191.33.183.251", prefix_len: 32}  # MGMT-CLIENT2 / DATWEB-VIVO
                      - remote_ip: {address_prefix: "45.189.41.96", prefix_len: 32}    # MGMT-CLIENT3 / DATWEB-ULTRA
                      - remote_ip: {address_prefix: "187.123.25.199", prefix_len: 32}  # MGMT-CLIENT4 / DATWEB-CLARO
                      - remote_ip: {address_prefix: "70.38.60.69", prefix_len: 32}     # MGMT-CLIENT5 - Leaseweb MTL
                      - remote_ip: {address_prefix: "138.99.19.108", prefix_len: 32}   # MGMT-CLIENT6
                      - remote_ip: {address_prefix: "181.191.209.180", prefix_len: 32} # MGMT-CLIENT7
                      - remote_ip: {address_prefix: "45.174.195.132", prefix_len: 32}  # MGMT-CLIENT8
                      - remote_ip: {address_prefix: "72.55.168.13", prefix_len: 32}    # MGMT-CLIENT9/10
                      - remote_ip: {address_prefix: "181.191.209.181", prefix_len: 32} # MGMT-CLIENT11
                      - remote_ip: {address_prefix: "181.191.209.182", prefix_len: 32} # MGMT-CLIENT12
                      - remote_ip: {address_prefix: "181.191.209.179", prefix_len: 32} # MGMT-CLIENT13
                      - remote_ip: {address_prefix: "201.42.19.52", prefix_len: 32}    # DATWEB SP-VIVO
                      - remote_ip: {address_prefix: "186.192.131.216", prefix_len: 32} # DATWEB SP-DURAND
