apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-config
  namespace: keycloak
data:
  KC_DB: postgres
  KC_PROXY: edge
  KC_HOSTNAME: auth.datweb.com.br
  KC_HOSTNAME_URL: https://auth.datweb.com.br
  KC_HTTP_ENABLED: "true"
  KC_HEALTH_ENABLED: "true"
  KC_METRICS_ENABLED: "true"
  KC_LOG_LEVEL: INFO
  DB_ADDR: postgres-service.keycloak.svc.cluster.local
  DB_PORT: "5432"
  DB_DATABASE: keycloak
